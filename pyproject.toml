[project]
name = "kernel-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib==3.6.2",
    "torch==2.2.2",
    "numpy==1.24.4",
    "scipy>=1.15.3",
    "scikit-learn==1.1.3",
    "pykan>=0.2.8",
    "pyyaml>=6.0.3",
    "setuptools==65.5.0",
    "sympy==1.11.1",
    "tqdm==4.66.2",
    "pandas==2.0.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernel_learning*"]
